services:
  mariadb:
    image: mariadb:10.11
    container_name: infra-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "6001:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mirage-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: infra-pma
    restart: always
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 64M
    ports:
      - "7001:80"
    networks:
      - mirage-net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: infra-mqtt
    restart: always
    ports:
      - "6002:1883"
      - "6003:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mirage-net

  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    container_name: infra-mqtt-web
    restart: always
    ports:
      - "7002:4000"
    environment:
      - HTTP_PORT=4000
    depends_on:
      - mosquitto
    networks:
      - mirage-net

networks:
  mirage-net:
    name: mirage-net
    driver: bridge

volumes:
  mysql_data:
