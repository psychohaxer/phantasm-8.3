services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${UID:-1000}
        APP_GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: boilerplate-app-dev
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - phantasm-net

  nginx:
    image: nginx:alpine
    container_name: boilerplate-nginx-dev
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - phantasm-net

networks:
  phantasm-net:
    external: true
    name: phantasm-net
